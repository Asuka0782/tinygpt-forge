[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "tinygpt-forge"
version = "0.0.1"
description = "A correctness-first GPT systems lab, from readable equations to measured kernels."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.15"
dependencies = [
  "safetensors>=0.4.5",
  "torch>=2.3,<3.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.0",
  "ruff==0.15.14",
]
plots = [
  "matplotlib>=3.8",
  "numpy>=1.26",
]

[project.scripts]
tinygpt = "tinygpt_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
