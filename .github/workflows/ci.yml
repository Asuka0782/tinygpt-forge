name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Lint
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.15.14"
          args: check
      - name: Check formatting
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.15.14"
          args: format --check --diff

  cpu-tests:
    name: CPU tests (Python ${{ matrix.python-version }}, PyTorch ${{ matrix.torch-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            torch-version: "2.3.0"
          - python-version: "3.14"
            torch-version: "2.13.0"
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Audit clean checkout hygiene
        run: python scripts/repository_audit.py
      - name: Install CPU PyTorch and project
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==${{ matrix.torch-version }}" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Run installed CLI smoke test
        run: tinygpt smoke --config configs/tiny_cpu.toml --seed 42

  type-check:
    name: Mypy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU PyTorch, project, and mypy
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.13.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . mypy==2.3.0
      - name: Type-check source
        run: mypy src

  package:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Build source distribution and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Install wheel and run CLI smoke test
        run: |
          python -m pip install "torch==2.13.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy>=1.26,<2.0" "safetensors>=0.4.5"
          python -m pip install --force-reinstall --no-deps dist/*.whl
          tinygpt smoke --config configs/tiny_cpu.toml --seed 42
